const welcomeText = "欢迎来自远方的朋友~";

	const initHomeHero = () => {
		const typingTarget = document.getElementById("home-typing");
		const typingValue = typingText;
		let idx = 0;
		let deleting = false;
		if (window.__homeTypingTimer) clearInterval(window.__homeTypingTimer);
		window.__homeTypingTimer = setInterval(() => {
			if (!typingTarget) return;
			typingTarget.textContent = typingValue.slice(0, idx);
			if (!deleting) {
				idx += 1;
				if (idx > typingValue.length) {
					deleting = true;
					idx = typingValue.length;
				}
			} else {
				idx -= 1;
				if (idx < 1) {
					deleting = false;
					idx = 1;
				}
			}
		}, 120);

		const locationTarget = document.getElementById("home-location");
		if (locationTarget) locationTarget.textContent = welcomeText;
		fetch("https://ipapi.co/json/")
			.then((res) => res.json())
			.then((data) => {
				const cn = data?.country_name === "China";
				const locationName = cn
					? [data?.region, data?.city].filter(Boolean).join(" ") || "中国"
					: data?.country_name || "远方";
				if (locationTarget) locationTarget.textContent = `欢迎来自${locationName}的朋友~`;
			})
			.catch(() => {
				if (locationTarget) locationTarget.textContent = welcomeText;
			});

		const player = document.getElementById("home-audio");
		const playlistSelect = document.getElementById("playlist-select");
		if (player instanceof HTMLAudioElement && playlistSelect instanceof HTMLSelectElement) {
			if (playlistSelect.dataset.bound !== "1") {
				playlistSelect.dataset.bound = "1";
				playlistSelect.addEventListener("change", () => {
					player.src = playlistSelect.value;
					player.play().catch(() => {});
				});
			}
		}

		const colorPicker = document.getElementById("home-color-picker");
		const colorHex = document.getElementById("home-color-hex");
		if (colorPicker instanceof HTMLInputElement && colorHex instanceof HTMLInputElement) {
			if (colorPicker.dataset.bound !== "1") {
				colorPicker.dataset.bound = "1";
				colorPicker.addEventListener("input", () => {
					colorHex.value = colorPicker.value.toUpperCase();
				});
			}
			if (colorHex.dataset.bound !== "1") {
				colorHex.dataset.bound = "1";
				colorHex.addEventListener("input", () => {
					const value = colorHex.value.trim();
					if (/^#([0-9A-Fa-f]{6})$/.test(value)) colorPicker.value = value;
				});
			}
		}

		const openSearchBtn = document.getElementById("open-home-search");
		if (openSearchBtn instanceof HTMLButtonElement && openSearchBtn.dataset.bound !== "1") {
			openSearchBtn.dataset.bound = "1";
			openSearchBtn.addEventListener("click", () => {
				document.querySelector<HTMLButtonElement>("site-search button[data-open-modal]")?.click();
			});
		}
	};
	document.addEventListener("astro:page-load", initHomeHero);
	initHomeHero();
})();</script>
