,{"month":"2025-01","items":[{"title":"ab250101","image":"https://i.postimg.cc/WbS1xc9v/ab250101.jpg","description":"2025-01-01"},{"title":"by2501","image":"https://i.postimg.cc/vTb6LLBF/by2501.jpg","description":"2025-01-01"}]},{"month":"2025-02","items":[{"title":"ab250214","image":"https://i.postimg.cc/y8bYYXCY/ab250214.png","description":"2025-02-14"},{"title":"b250213","image":"https://i.postimg.cc/xCHKP13m/b250213.png","description":"2025-02-13"}]},{"month":"2025-03","items":[{"title":"yda250310","image":"https://i.postimg.cc/D0ZxJZj1/yda250310.jpg","description":"2025-03-10"}]},{"month":"2025-04","items":[{"title":"ak250426","image":"https://i.postimg.cc/tRMrksb9/ak250426.jpg","description":"2025-04-26"},{"title":"e250416","image":"https://i.postimg.cc/4dLTBX4R/e250416.jpg","description":"2025-04-16"},{"title":"nnz250409","image":"https://i.postimg.cc/Dz00VyDS/nnz250409.png","description":"2025-04-09"}]},{"month":"2025-05","items":[{"title":"b250518","image":"https://i.postimg.cc/59BBYj01/b250518.png","description":"2025-05-18"},{"title":"shiwase250526","image":"https://i.postimg.cc/fyt1CXg2/shiwase250526.png","description":"2025-05-26"}]},{"month":"2025-06","items":[{"title":"250624","image":"https://i.postimg.cc/c4JvxJtg/250624.jpg","description":"2025-06-24"},{"title":"ak250624","image":"https://i.postimg.cc/SKddMsVb/ak250624.png","description":"2025-06-24"},{"title":"eb250623","image":"https://i.postimg.cc/TPcx5rZV/eb250623.jpg","description":"2025-06-23"},{"title":"mmw250615","image":"https://i.postimg.cc/x1vDBvjg/mmw250615.png","description":"2025-06-15"}]},{"month":"2025-07","items":[{"title":"e250711","image":"https://i.postimg.cc/9XLfnjg5/e250711.jpg","description":"2025-07-11"},{"title":"eb250706","image":"https://i.postimg.cc/HWBKYGZQ/eb250706.jpg","description":"2025-07-06"},{"title":"sty250706","image":"https://i.postimg.cc/1tyCSMDC/sty250706.png","description":"2025-07-06"},{"title":"sty250706trans","image":"https://i.postimg.cc/hjMCtxrS/sty250706trans.png","description":"2025-07-06"}]},{"month":"2025-08","items":[{"title":"250812","image":"https://i.postimg.cc/LXRsr4Mf/250812.jpg","description":"2025-08-12"},{"title":"e250806","image":"https://i.postimg.cc/N0jSNgDF/e250806.png","description":"2025-08-06"}]},{"month":"2025-09","items":[{"title":"e250830","image":"https://i.postimg.cc/pX9Pc5nG/e250830.jpg","description":"2025-09-30"}]},{"month":"2025-10","items":[{"title":"bunny的校服搭配","image":"https://i.postimg.cc/4xSVk98R/b251003.jpg","description":"2025-10-03"}]},{"month":"2025-11","items":[{"title":"ak酱的一个pc","image":"https://i.postimg.cc/Y05zHm2F/ak251117.png","description":"2025-11-17"},{"title":"meme","image":"https://i.postimg.cc/43GZ382v/e2511.png","description":"2025-11-01"}]},{"month":"2025-12","items":[{"title":"摸鱼251223","image":"https://i.postimg.cc/MpcCTrt3/b251223.png","description":"2025-12-23"}]},{"month":"2026-03","items":[{"title":"性转版盐","image":"https://i.postimg.cc/50vwpQ1q/we260302.png","description":"2026-03-02"}]},{"month":"2026-04","items":[{"title":"eucaly","image":"https://i.postimg.cc/XqJ74YcB/e260407.jpg","description":"2026-04-07"},{"title":"bunny","image":"https://i.postimg.cc/Sx8Qy58g/b260410.jpg","description":"2026-04-10"},{"title":"ak 21","image":"https://i.postimg.cc/c1TYXhZn/ak260412.png","description":"2026-04-12"},{"title":"ak","image":"https://i.postimg.cc/59KTxjQ4/ak260428.jpg","description":"2026-04-28"},{"title":"bunny","image":"https://i.postimg.cc/tRvwX7nj/b260429.jpg","description":"2026-04-29"}]},{"month":"2026-05","items":[{"title":"双人","image":"https://i.postimg.cc/dVSjhb0H/eb2605.jpg","description":"2026-05"},{"title":"摸鱼","image":"https://i.postimg.cc/N0D4Q5k0/e260527.jpg","description":"2026-05-27"}]}];

	// ============================================================
	// 状态
	// ============================================================
	let currentSpread = 0;
	const totalSpreads = Math.max(1, Math.ceil(months.length / 2));

	const book = document.getElementById('book');
	const pageLeftInner = document.getElementById('pageLeftInner');
	const pageRightInner = document.getElementById('pageRightInner');
	const prevBtn = document.getElementById('prevBtn');
	const nextBtn = document.getElementById('nextBtn');
	const indicator = document.getElementById('pageIndicator');

	// ============================================================
	// 工具
	// ============================================================
	const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

	function escapeHtml(s) {
		return String(s ?? '').replace(/[&<>"']/g, c => ({
			'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
		}[c]));
	}

	function parseMonthLabel(label) {
		if (!label) return { year: '', monthName: '' };
		const m = /^(\d{4})-(\d{2})$/.exec(label);
		if (!m) return { year: '', monthName: label };
		return {
			year: m[1],
			monthName: MONTH_NAMES[parseInt(m[2], 10) - 1] || m[2],
		};
	}

	function tileTilt(idx) {
		const tilts = [-1.2, 0.8, -0.5, 1.5, -0.9, 0.3, -1.5, 1.1, -0.3, 0.9];
		return tilts[idx % tilts.length];
	}

	function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

	// ============================================================
	// 渲染页面内容（返回 HTML 字符串）
	// ============================================================
	function renderPageHTML(month) {
		if (!month) {
			return `<div class="page-empty"><div>The end</div></div>`;
		}

		const { year, monthName } = parseMonthLabel(month.month);
		const items = month.items || [];

		let html = `
			<div class="page-month-header">
				<div class="page-year">${escapeHtml(year)}</div>
				<div class="page-month">${escapeHtml(monthName)}</div>
			</div>
			<div class="page-grid">
		`;

		items.forEach((item, idx) => {
			const tilt = tileTilt(idx);
			const desc = item.description || month.month;
			html += `
				<article class="page-tile" style="--tilt: ${tilt}deg"
					data-src="${escapeHtml(item.image)}"
					data-title="${escapeHtml(item.title)}"
					data-desc="${escapeHtml(desc)}">
					<img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.title)}" loading="lazy" />
					<div class="page-tile-caption">${escapeHtml(item.title)}</div>
				</article>
			`;
		});

		html += `</div>`;
		return html;
	}

	function renderPage(innerEl, month) {
		innerEl.innerHTML = renderPageHTML(month);
	}

	function renderSpread() {
		const leftIdx = currentSpread * 2;
		const rightIdx = leftIdx + 1;

		renderPage(pageLeftInner, months[leftIdx]);
		renderPage(pageRightInner, months[rightIdx]);

		if (indicator) {
			if (!months.length) {
				indicator.textContent = '0 / 0';
			} else {
				const startPage = leftIdx + 1;
				const endPage = Math.min(rightIdx + 1, months.length);
				indicator.textContent = `${startPage} – ${endPage} / ${months.length}`;
			}
		}

		if (prevBtn) prevBtn.disabled = currentSpread <= 0;
		if (nextBtn) nextBtn.disabled = currentSpread >= totalSpreads - 1;
	}

	// ============================================================
	// 仿真翻页 —— 一张纸绕书脊旋转
	// ============================================================
	let isAnimating = false;
	const FLIP_DURATION = 750;

	async function turnPage(direction) {
		if (isAnimating) return;

		const newSpread = direction === 'next' ? currentSpread + 1 : currentSpread - 1;
		if (newSpread < 0 || newSpread >= totalSpreads) return;

		isAnimating = true;

		// 创建翻动纸张
		const sheet = document.createElement('div');
		sheet.className = 'flip-sheet';
		sheet.dataset.dir = direction;

		const front = document.createElement('div');
		front.className = 'flip-face flip-front';

		const back = document.createElement('div');
		back.className = 'flip-face flip-back';

		if (direction === 'next') {
			// 翻下一页：
			//   正面 = 当前右页（months[currentSpread * 2 + 1]）
			//   背面 = 下一跨页的左页（months[newSpread * 2]）
			//   铰链在左边缘（书脊）
			front.innerHTML = `<div class="page-inner">${renderPageHTML(months[currentSpread * 2 + 1])}</div>`;
			back.innerHTML  = `<div class="page-inner">${renderPageHTML(months[newSpread * 2])}</div>`;

			sheet.style.left = '50%';
			sheet.style.right = '0';
			sheet.style.transformOrigin = 'left center';
		} else {
			// 翻上一页：
			//   正面 = 当前左页（months[currentSpread * 2]）
			//   背面 = 上一跨页的右页（months[newSpread * 2 + 1]）
			//   铰链在右边缘（书脊）
			front.innerHTML = `<div class="page-inner">${renderPageHTML(months[currentSpread * 2])}</div>`;
			back.innerHTML  = `<div class="page-inner">${renderPageHTML(months[newSpread * 2 + 1])}</div>`;

			sheet.style.left = '0';
			sheet.style.right = '50%';
			sheet.style.transformOrigin = 'right center';
		}

		sheet.appendChild(front);
		sheet.appendChild(back);
		book.appendChild(sheet);

		// 下一帧触发动画
		requestAnimationFrame(() => {
			requestAnimationFrame(() => {
				sheet.classList.add(direction === 'next' ? 'flipping-next' : 'flipping-prev');
			});
		});

		await wait(FLIP_DURATION);

		// 动画完成，更新实际内容并移除翻页纸
		currentSpread = newSpread;
		renderSpread();
		sheet.remove();

		isAnimating = false;
	}

	// ============================================================
	// 事件
	// ============================================================
	prevBtn?.addEventListener('click', () => turnPage('prev'));
	nextBtn?.addEventListener('click', () => turnPage('next'));

	document.addEventListener('keydown', (e) => {
		if (e.key === 'ArrowLeft') turnPage('prev');
		if (e.key === 'ArrowRight') turnPage('next');
	});

	// 点击书的左右边缘翻页
	book?.addEventListener('click', (e) => {
		if (e.target.closest('.page-tile')) return;
		const rect = book.getBoundingClientRect();
		const x = e.clientX - rect.left;
		if (x < rect.width * 0.12) turnPage('prev');
		else if (x > rect.width * 0.88) turnPage('next');
	});

	// ============================================================
	// 灯箱
	// ============================================================
	const box = document.getElementById('gallery-lightbox');
	const lbImg = document.getElementById('gallery-lightbox-image');
	const lbText = document.getElementById('gallery-lightbox-text');
	let lbIndex = 0;

	function getAllTiles() {
		return [...document.querySelectorAll('.page-tile')];
	}

	function showTile(tile) {
		if (!tile) return;
		lbImg.src = tile.dataset.src || '';
		lbImg.alt = tile.dataset.title || '';
		lbText.textContent = `${tile.dataset.title || ''} — ${tile.dataset.desc || ''}`;
	}

	function openLightbox(tile) {
		const tiles = getAllTiles();
		lbIndex = tiles.indexOf(tile);
		if (lbIndex < 0) return;
		showTile(tile);
		box.removeAttribute('hidden');
		document.body.style.overflow = 'hidden';
	}

	function closeLightbox() {
		box.setAttribute('hidden', 'hidden');
		lbImg.src = '';
		document.body.style.overflow = '';
	}

	document.addEventListener('click', (e) => {
		const tile = e.target.closest('.page-tile');
		if (!tile) return;
		e.stopPropagation();
		openLightbox(tile);
	});

	box?.addEventListener('click', (e) => {
		if (e.target === box) closeLightbox();
	});

	document.addEventListener('keydown', (e) => {
		if (e.key === 'Escape' && box && !box.hasAttribute('hidden')) {
			closeLightbox();
		}
	});

	document.querySelector('.gallery-arrow[data-dir="prev"]')?.addEventListener('click', (e) => {
		e.stopPropagation();
		const tiles = getAllTiles();
		if (!tiles.length) return;
		lbIndex = (lbIndex - 1 + tiles.length) % tiles.length;
		showTile(tiles[lbIndex]);
	});

	document.querySelector('.gallery-arrow[data-dir="next"]')?.addEventListener('click', (e) => {
		e.stopPropagation();
		const tiles = getAllTiles();
		if (!tiles.length) return;
		lbIndex = (lbIndex + 1) % tiles.length;
		showTile(tiles[lbIndex]);
	});

	// ============================================================
	// 启动
	// ============================================================
	renderSpread();
})();</script> </body> </html>
