[[memos]]
date = "2025-12-29"
text = """
这个周末是失败的两天，本来要做英语课的长难句分析的PPT。。。回到家打开电脑，心里想着是找英文语料，手却输入某某网址看了4个小时推特，心情立刻差下来，一怒之下下载了个stayfocus的插件然后把推特和ytb啥的都ban了，开始做，实际上是问ai思路半天，也没想好讲什么。主要是语法这种东西要讲就只能讲一节课，15分钟之内讲完什么的....做不到啦，选合适题材之类的。一看凌晨了，写了几道数学，就这样睡了。
第二天起来发誓当天一定要完成。看两节物理课写了点题就开始准备做，想着好不容易讲一次一定要有创意，考虑的是计算机/人工智能/民主人权，不过也没搜到合适的英文网页讲，最后还是没完成。放松一下，剩下时间就鼓捣自己的hexo博客搭建了，换了2个主题，才弄得像样，头痛。效率好低。hexo是最不需要什么技术含量就能做博客的框架了，但是就弄半天，果然没有那么简单的事情啊。与这种莫名其妙不知道哪里错还要自己排查的东西一比，好像物理题都慈眉善目了好多。总结就是，这个周末一如既往地浪费掉了。以后不能这样了。
"""

